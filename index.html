
<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#092127">
<title>BLY – Fiktiv Demo</title>

<style>
:root {
  --bg: #092127;
  --ink: #092127;
  --phone-scale: 1;
  --qr-size: 155px;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  overscroll-behavior: none;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
  color: white;
}

body { background: #101820; }
button { font: inherit; cursor: pointer; }
button:focus-visible { outline: 3px solid #56d8d4; outline-offset: 4px; }

/* PHONE */

.preview-stage {
  position: fixed;
  inset: 0;
  display: grid;
  place-items: center;
  overflow: hidden;
}

.phone {
  position: absolute;
  width: 390px;
  height: 844px;
  left: 50%;
  top: 50%;
  overflow: hidden;
  border-radius: 48px;
  border: 7px solid #05090c;
  background: var(--bg);
  box-shadow: 0 0 0 2px #56636b, 0 20px 80px #0009;
  isolation: isolate;
  transform: translate(-50%, -50%) scale(var(--phone-scale));
  transform-origin: center;
}

.phone-screen {
  position: relative;
  width: 100%;
  height: 100%;
  overflow: hidden;
  border-radius: 40px;
  background: var(--bg);
}

/* HOME */

.home {
  position: relative;
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 24px 18px 130px;
}

.home-logo {
  font-size: 130px;
  font-weight: 900;
  font-style: italic;
  letter-spacing: -.13em;
  line-height: .8;
  padding-right: .14em;
}

.home-name {
  margin-top: 12px;
  font-size: 48px;
  font-weight: 800;
  font-style: italic;
  letter-spacing: -.05em;
}

.nav {
  position: absolute;
  bottom: 40px;
  left: 0;
  right: 0;
  display: flex;
  justify-content: space-around;
  align-items: flex-end;
  gap: 8px;
  padding: 0 16px;
}

.nav button {
  width: 33.33%;
  border: 0;
  background: none;
  color: white;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  font-size: 14px;
  white-space: nowrap;
}

.nav svg {
  width: 37px;
  height: 37px;
  stroke: currentColor;
  fill: none;
  stroke-width: 2.4;
  stroke-linecap: round;
  stroke-linejoin: round;
}

/* DEMO SCREEN */

.overlay {
  position: absolute;
  inset: 0;
  z-index: 10;
  display: none;
  overflow: hidden;
  touch-action: none;
  background:
    radial-gradient(ellipse at 12% 66%, #5fbd93 0%, transparent 55%),
    linear-gradient(120deg, #193d4e, #1b4751 60%, #193d4e);
}

.overlay.open { display: block; }

.id-layout {
  position: relative;
  width: 100%;
  height: 100%;
  padding: 26px 9px 0;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.identity {
  position: relative;
  width: 100%;
  height: 650px;
  flex: none;
  border-radius: 18px;
  background: white;
  color: var(--ink);
  overflow: hidden;
  isolation: isolate;
}

.lines {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 0;
  pointer-events: none;
}

.bly-lines-clockwise {
  transform-origin: 50% 50%;
  animation: rotateClockwise 76s linear infinite;
}

.bly-lines-counterclockwise {
  transform-origin: 50% 50%;
  animation: rotateCounterclockwise 94s linear infinite;
}

@keyframes rotateClockwise {
  to { transform: rotate(360deg); }
}

@keyframes rotateCounterclockwise {
  to { transform: rotate(-360deg); }
}

.id-top {
  position: relative;
  z-index: 3;
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  padding: 7px 10px;
}

.close, .dots {
  border: 0;
  background: none;
  color: var(--ink);
  font-weight: 300;
  line-height: 1;
}

.close { font-size: 30px; }
.dots { font-size: 33px; }

.demo-logo {
  position: absolute;
  top: 17px;
  left: 50%;
  transform: translateX(-50%);
  width: 65px;
  max-height: 60px;
  object-fit: contain;
  z-index: 4;
}

.person {
  position: absolute;
  z-index: 2;
  top: 10%;
  left: 50%;
  transform: translateX(-50%);
  width: 70%;
  max-width: 280px;
  background: transparent !important;
}

.portrait {
  display: block;
  width: 100%;
  aspect-ratio: 1 / 1.3;
  object-fit: cover;
  object-position: center;
  background: transparent !important;
  border: none;
  box-shadow:none;
}

.age {
  position: absolute;
  right: -32px;
  bottom: 0;
  padding: 5px 3px 0 13px;
  border-radius: 6px 0 0 0;
  background: white;
  font-size: 47px;
  line-height: 1;
  font-weight: 500;
}

.details {
  position: absolute;
  z-index: 2;
  top: 65%;
  width: 100%;
  padding: 0 12px;
  text-align: center;
}

.person-name {
  font-size: 34px;
  font-weight: 500;
  letter-spacing: -.035em;
  line-height: 1.05;
}

.number {
  font-size: 19px;
  font-weight: 500;
  letter-spacing: .02em;
  line-height: 1.1;
  color: #66757b;
}

.demo-warning {
  position: absolute;
  top: -83px;
  left: 50%;
  transform: translateX(-50%);
  background: #fff0df;
  padding: 7px 10px;
  border-radius: 5px;
  font-size: 11px;
  font-weight: 800;
  letter-spacing: .06em;
  white-space: nowrap;
  z-index: 5;
}

/* DECORATIVE QR */

.qr-wrap {
  position: relative;
  z-index: 2;
  margin-top: -78px;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.qr-panel {
  width: var(--qr-size);
  height: var(--qr-size);
  padding: 12px;
  background: white;
  box-shadow: 0 8px 10px #0002;
}

.qr-image {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
}

.yellow-box {
  position: absolute;
  top: -53px;
  left: 50%;
  transform: translateX(-50%);
  width: 235px;
  height: 38px;
  background: #fff0df;
  border-radius: 5px;
  z-index: 3;
  display: flex;
align-items: center;
justify-content: center;
color: #092127;
font-size: 16px;
font-weight: 600;
text-align: center;
}

.yellow-box::after {
  content: "";
  position: absolute;
  bottom: -10px;
  left: 50%;
  transform: translateX(-50%);
  border-left: 11px solid transparent;
  border-right: 11px solid transparent;
  border-top: 11px solid #fff0df;
}

.caption {
  margin-top: 18px;
  color: white;
  font-size: 15px;
  line-height: 1.35;
  text-align: center;
}

.footnote {
  margin-top: 12px;
  color: #d8e6e8;
  font-size: 12px;
  text-align: center;
}

/* PIXEL CENSOR */

#pixelPatch {
  position: absolute;
  z-index: 9999;
  left: 0;
  top: 0;
  width: 140px;
  height: 140px;
  transform: translate(-50%, -50%);
  pointer-events: none;
  visibility: hidden;
  background: none;
  border: none;
  box-shadow: none;
}

#pixelPatch.visible { visibility: visible; }

#pixelCanvas {
  display: block;
  width: 100%;
  height: 100%;
  image-rendering: pixelated;
}

.toast {
  position: absolute;
  z-index: 20;
  bottom: 22px;
  left: 50%;
  transform: translateX(-50%);
  display: none;
  padding: 12px 18px;
  border-radius: 12px;
  background: white;
  color: var(--ink);
  white-space: nowrap;
}

@media (max-width: 600px) {
  body { background: var(--bg); }
  .preview-stage { display: block; }

  .phone {
    position: relative;
    left: auto;
    top: auto;
    width: 100%;
    height: 100svh;
    border: 0;
    border-radius: 0;
    box-shadow: none;
    transform: none;
  }

  .phone-screen { border-radius: 0; }
  .id-layout { padding-top: 12px; }
  .identity { height: min(650px, 77svh); }
}

@media (prefers-reduced-motion: reduce) {
  .bly-lines-clockwise,
  .bly-lines-counterclockwise {
    animation: none;
  }
}
</style>
</head>

<body>

<div class="preview-stage">
  <div class="phone" id="phone">
    <div class="phone-screen" id="phoneScreen">

      <main class="home">
        <div class="home-logo" aria-hidden="true">B</div>
        <div class="home-name">BLY</div>

        <nav class="nav">
          <button id="openId">
            <svg viewBox="0 0 32 32">
              <rect x="5" y="2" width="22" height="28" rx="1"/>
              <circle cx="16" cy="11" r="3" fill="currentColor" stroke="none"/>
              <path d="M10 20c0-6 12-6 12 0M11 25h10"/>
            </svg>
            <span>BLY</span>
          </button>

          <button id="scan">
            <svg viewBox="0 0 32 32">
              <path d="M3 11V3h8M21 3h8v8M29 21v8h-8M11 29H3v-8"/>
              <path d="M11 11h4v4h-4zM19 11h3v3h-3zM18 19h4v4h-4z"/>
            </svg>
            <span>Skanna QR-kod</span>
          </button>

          <button id="menu">
            <svg viewBox="0 0 32 32">
              <path d="M3 7h26M3 16h26M3 25h26"/>
            </svg>
            <span>Meny</span>
          </button>
        </nav>
      </main>

      <section class="overlay" id="overlay"
        role="dialog" aria-modal="true"
        aria-label="BLY Fiktiv Demo">

        <div class="id-layout">
          <article class="identity">

            <svg class="lines" viewBox="0 0 420 760"
              preserveAspectRatio="none" aria-hidden="true">
              <g id="clockwiseLines" class="bly-lines-clockwise"></g>
              <g id="counterclockwiseLines" class="bly-lines-counterclockwise"></g>
            </svg>

            <header class="id-top">
              <button class="close" id="closeId" aria-label="Stäng">×</button>
              <button class="dots" id="more" aria-label="Fler alternativ">⋮</button>
            </header>

            <img class="demo-logo" src="bly-logo.png" alt="BLY Demo">

            <div class="person">
              <img class="portrait" src="portrait.png" alt="Demoporträtt">
              <div class="age">18</div>
            </div>

            <div class="details">
              <div class="person-name">Johannes Young</div>
              <div class="number">080413-7459</div>
            </div>
          </article>

          <div class="qr-wrap">
            <div class="yellow-box">Skanna med en BankID-app</div>
            <div class="qr-panel">
              <img class="qr-image" src="qr-code.png" alt="Dekorativ demo QR-kod">
            </div>
            <div class="caption">
              Delas via QR-koden:<br>
              Foto, namn och personnummer
            </div>
          </div>
        </div>
      </section>

      <div id="pixelPatch" aria-hidden="true">
        <canvas id="pixelCanvas"></canvas>
      </div>

      <div class="toast" id="toast" role="status"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

<script>
/* PHONE SCALING */

function fitPhoneToScreen() {
  const phone = document.getElementById('phone');
  if (window.innerWidth <= 600) {
    phone.style.setProperty('--phone-scale', 1);
    return;
  }

  const scale = Math.min(
    (window.innerWidth - 50) / 390,
    (window.innerHeight - 50) / 844,
    1
  );

  phone.style.setProperty('--phone-scale', Math.max(.1, scale));
}

window.addEventListener('resize', fitPhoneToScreen);
fitPhoneToScreen();

/* NAVIGATION */

const phoneScreen = document.getElementById('phoneScreen');
const overlay = document.getElementById('overlay');
const toast = document.getElementById('toast');
let toastTimer;

function showToast(message) {
  toast.textContent = message;
  toast.style.display = 'block';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => {
    toast.style.display = 'none';
  }, 2300);
}

document.getElementById('openId').addEventListener('click', () => {
  overlay.classList.add('open');
  prepareScreenCapture();
});

function closeCard() {
  stopPixelation();
  overlay.classList.remove('open');
}

document.getElementById('closeId').addEventListener('click', closeCard);

document.addEventListener('keydown', event => {
  if (event.key === 'Escape') closeCard();
});

document.getElementById('scan').addEventListener('click', () => {
  showToast('QR-skanning kommer senare');
});

document.getElementById('menu').addEventListener('click', () => {
  showToast('Meny kommer senare');
});

document.getElementById('more').addEventListener('click', () => {
  showToast('BLY Demo');
});


/* 32 ANIMATED DEFORMED SECURITY LINES */

{
  const clockwise = document.getElementById('clockwiseLines');
  const counterclockwise = document.getElementById('counterclockwiseLines');

  const colors = [
    '#e5a4ce',
    '#a4d7e1',
    '#b4b5df',
    '#b6d4d0'
  ];

  function addLine(group, index, reverse) {
    const path = document.createElementNS(
      'http://www.w3.org/2000/svg',
      'path'
    );

    const points = [];
    const baseRadius = 25 + index * 20;

    for (let j = 0; j <= 240; j++) {
      const angle = (j / 240) * Math.PI * 2;

      // Large, smooth, irregular deformations
      const deformation =
        Math.sin(angle * 2 + 0.5) * 0.15 +
        Math.sin(angle * 3 - 0.9) * 0.10 +
        Math.cos(angle * 5 + 0.8) * 0.06 +
        Math.sin(angle * 8 - 1.5) * 0.025;

      // Slight differences between individual lines
      const variation =
        Math.sin(angle * 4 + index * 0.12) * 2;

      const radius =
        baseRadius * (1 + deformation) + variation;

      const x =
        210 + Math.cos(angle) * radius * 1.08;

      const y =
        380 + Math.sin(angle) * radius * 1.17;

      points.push(
        `${j === 0 ? 'M' : 'L'} ${x.toFixed(2)} ${y.toFixed(2)}`
      );
    }

    path.setAttribute('d', points.join(' ') + ' Z');
    path.setAttribute('fill', 'none');

    path.setAttribute(
      'stroke',
      colors[(index + (reverse ? 2 : 0)) % colors.length]
    );

    path.setAttribute('stroke-width', '0.85');
    path.setAttribute('opacity', reverse ? '0.5' : '0.65');

    group.appendChild(path);
  }

  for (let i = 0; i < 32; i++) {
    addLine(clockwise, i, false);
    addLine(counterclockwise, i, true);
  }
}

/* PIXEL CENSOR */

const pixelPatch = document.getElementById('pixelPatch');
const pixelCanvas = document.getElementById('pixelCanvas');
const pixelCtx = pixelCanvas.getContext('2d', { alpha: true });

const PIXEL_DIAMETER = 140;
const HOLD_BLOCK_SIZE = 34;
const RESTORE_DURATION = 380;

pixelCanvas.width = PIXEL_DIAMETER;
pixelCanvas.height = PIXEL_DIAMETER;

const pixelBuffer = document.createElement('canvas');
const pixelBufferCtx = pixelBuffer.getContext('2d', { alpha: true });

let screenSnapshot = null;
let captureVersion = 0;
let capturePromise = null;
let pixelActive = false;
let activePointerId = null;
let pixelX = 0;
let pixelY = 0;
let restoreFrame = null;
let drawPending = false;

/* CAPTURE ONCE */

async function prepareScreenCapture() {
  if (screenSnapshot) return screenSnapshot;
  if (capturePromise) return capturePromise;

  const version = ++captureVersion;

  const promise = (async () => {
    if (typeof html2canvas !== 'function') {
      console.error('html2canvas could not load');
      return null;
    }

    await Promise.all(
      Array.from(overlay.querySelectorAll('img')).map(img => {
        if (img.complete) return Promise.resolve();

        return new Promise(resolve => {
          img.addEventListener('load', resolve, { once: true });
          img.addEventListener('error', resolve, { once: true });
        });
      })
    );

    await new Promise(resolve => requestAnimationFrame(resolve));

    const snapshot = await html2canvas(overlay, {
      backgroundColor: '#193d4e',
      scale: 1,
      useCORS: true,
      allowTaint: false,
      logging: false,
      width: overlay.clientWidth,
      height: overlay.clientHeight,
      onclone: clonedDocument => {
        const clonedOverlay = clonedDocument.getElementById('overlay');
        if (clonedOverlay) {
          clonedOverlay.style.display = 'block';
          clonedOverlay.style.transform = 'none';
        }
      }
    });

    if (version !== captureVersion) return null;
    screenSnapshot = snapshot;

    if (pixelActive) requestPixelDraw();
    return snapshot;
  })();

  capturePromise = promise;

  try {
    return await promise;
  } catch (error) {
    console.error('Screen capture failed:', error);
    return null;
  } finally {
    if (capturePromise === promise) capturePromise = null;
  }
}

/* POINTER POSITION */

function getPhonePosition(clientX, clientY) {
  const rect = phoneScreen.getBoundingClientRect();

  return {
    x: (clientX - rect.left) * phoneScreen.clientWidth / rect.width,
    y: (clientY - rect.top) * phoneScreen.clientHeight / rect.height
  };
}

function positionPixelPatch() {
  pixelPatch.style.left = pixelX + 'px';
  pixelPatch.style.top = pixelY + 'px';
}

/* DRAW CENSOR WITHOUT ZOOM */

function drawPixelation(blockSize) {
  if (!screenSnapshot) return;

  const size = PIXEL_DIAMETER;
  const resolution = Math.min(
    size,
    Math.max(1, Math.round(size / Math.max(1, blockSize)))
  );

  if (pixelBuffer.width !== resolution ||
      pixelBuffer.height !== resolution) {
    pixelBuffer.width = resolution;
    pixelBuffer.height = resolution;
  }

  const scaleX = screenSnapshot.width / overlay.clientWidth;
  const scaleY = screenSnapshot.height / overlay.clientHeight;

  const sourceX = (pixelX - size / 2) * scaleX;
  const sourceY = (pixelY - size / 2) * scaleY;

  pixelBufferCtx.globalCompositeOperation = 'source-over';
  pixelBufferCtx.clearRect(0, 0, resolution, resolution);
  pixelBufferCtx.fillStyle = '#193d4e';
  pixelBufferCtx.fillRect(0, 0, resolution, resolution);
  pixelBufferCtx.imageSmoothingEnabled = true;

  pixelBufferCtx.drawImage(
    screenSnapshot,
    sourceX,
    sourceY,
    size * scaleX,
    size * scaleY,
    0,
    0,
    resolution,
    resolution
  );

  /* Stepped circular edge made from the pixels themselves */

  const radius = resolution / 2;

  pixelBufferCtx.globalCompositeOperation = 'destination-in';
  pixelBufferCtx.fillStyle = '#000';
  pixelBufferCtx.beginPath();

  for (let row = 0; row < resolution; row++) {
    const dy = row + .5 - radius;
    const halfWidth = Math.sqrt(
      Math.max(0, radius * radius - dy * dy)
    );

    const left = Math.max(
      0, Math.ceil(radius - halfWidth - .5)
    );

    const right = Math.min(
      resolution - 1,
      Math.floor(radius + halfWidth - .5)
    );

    if (right >= left) {
      pixelBufferCtx.rect(left, row, right - left + 1, 1);
    }
  }

  pixelBufferCtx.fill();
  pixelBufferCtx.globalCompositeOperation = 'source-over';

  pixelCtx.clearRect(0, 0, size, size);
  pixelCtx.imageSmoothingEnabled = false;

  pixelCtx.drawImage(
    pixelBuffer,
    0, 0, resolution, resolution,
    0, 0, size, size
  );
}

function requestPixelDraw() {
  if (drawPending) return;
  drawPending = true;

  requestAnimationFrame(() => {
    drawPending = false;
    if (!pixelActive || !screenSnapshot) return;

    positionPixelPatch();
    drawPixelation(HOLD_BLOCK_SIZE);
    pixelPatch.classList.add('visible');
  });
}

function stopPixelation() {
  pixelActive = false;
  activePointerId = null;
  captureVersion++;

  if (restoreFrame !== null) {
    cancelAnimationFrame(restoreFrame);
    restoreFrame = null;
  }

  pixelPatch.classList.remove('visible');
  pixelCtx.clearRect(0, 0, pixelCanvas.width, pixelCanvas.height);
  screenSnapshot = null;
}

/* PRESS AND HOLD */

overlay.addEventListener('pointerdown', event => {
  if (event.target.closest('button')) return;
  if (pixelActive) return;

  if (restoreFrame !== null) {
    cancelAnimationFrame(restoreFrame);
    restoreFrame = null;
  }

  pixelActive = true;
  activePointerId = event.pointerId;

  const pos = getPhonePosition(event.clientX, event.clientY);
  pixelX = pos.x;
  pixelY = pos.y;

  positionPixelPatch();

  try {
    overlay.setPointerCapture(event.pointerId);
  } catch (error) {}

  if (screenSnapshot) {
    requestPixelDraw();
  } else {
    prepareScreenCapture();
  }
});

/* MOVE */

overlay.addEventListener('pointermove', event => {
  if (!pixelActive || event.pointerId !== activePointerId) return;

  const pos = getPhonePosition(event.clientX, event.clientY);
  pixelX = pos.x;
  pixelY = pos.y;

  positionPixelPatch();
  requestPixelDraw();
});

/* RELEASE */

function releasePixelation() {
  if (!pixelActive) return;

  pixelActive = false;
  activePointerId = null;

  if (!screenSnapshot) {
    pixelPatch.classList.remove('visible');
    return;
  }

  const start = performance.now();

  function animateRestore(now) {
    const progress = Math.min(
      1,
      (now - start) / RESTORE_DURATION
    );

    const eased = 1 - Math.pow(1 - progress, 2);
    const blockSize =
      HOLD_BLOCK_SIZE * (1 - eased) + eased;

    drawPixelation(blockSize);

    if (progress < 1) {
      restoreFrame = requestAnimationFrame(animateRestore);
    } else {
      restoreFrame = null;
      pixelPatch.classList.remove('visible');
      pixelCtx.clearRect(0, 0, pixelCanvas.width, pixelCanvas.height);
    }
  }

  restoreFrame = requestAnimationFrame(animateRestore);
}

overlay.addEventListener('pointerup', event => {
  if (event.pointerId === activePointerId) releasePixelation();
});

overlay.addEventListener('pointercancel', event => {
  if (event.pointerId === activePointerId) releasePixelation();
});

window.addEventListener('blur', () => {
  pixelActive = false;
  activePointerId = null;

  if (restoreFrame !== null) {
    cancelAnimationFrame(restoreFrame);
    restoreFrame = null;
  }

  pixelPatch.classList.remove('visible');
});
</script>
</body>
</html>
