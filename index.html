
<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#092127">
<title>BLY – iPhone 14 Preview</title>

<style>
:root {
  --bg: #092127;
  --ink: #092127;
  --phone-width: 390px;
  --phone-height: 844px;
  --phone-scale: 1;
  --qr-size: 170px;
}

* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  overscroll-behavior: none;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
  color: white;
}

button {
  font: inherit;
  cursor: pointer;
}

button:focus-visible {
  outline: 3px solid #56d8d4;
  outline-offset: 4px;
}

/* DESKTOP PREVIEW */

body {
  background: #101820;
  overflow: hidden;
}

.preview-stage {
  position: fixed;
  inset: 0;
  display: grid;
  place-items: center;
  overflow: hidden;
}

.phone {
  position: absolute;
  width: var(--phone-width);
  height: var(--phone-height);
  left: 50%;
  top: 50%;
  overflow: hidden;
  border-radius: 48px;
  border: 7px solid #05090c;
  background: var(--bg);
  box-shadow: 0 0 0 2px #56636b, 0 20px 80px #0009;
  isolation: isolate;
  transform: translate(-50%, -50%) scale(var(--phone-scale));
  transform-origin: center center;
}

.phone-screen {
  position: relative;
  width: 100%;
  height: 100%;
  overflow: hidden;
  border-radius: 40px;
  background: var(--bg);
}

/* HOME SCREEN */

.home {
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  position: relative;
  padding: 24px 18px 130px;
}

.home-logo {
  font-size: 130px;
  font-weight: 900;
  font-style: italic;
  letter-spacing: -.13em;
  line-height: .8;
  padding-right: .14em;
}

.home-name {
  font-size: 48px;
  font-weight: 800;
  font-style: italic;
  letter-spacing: -.05em;
  margin-top: 12px;
}

.nav {
  position: absolute;
  bottom: 40px;
  left: 0;
  right: 0;
  display: flex;
  justify-content: space-around;
  align-items: flex-end;
  gap: 8px;
  padding: 0 16px;
}

.nav button {
  width: 33.33%;
  border: 0;
  background: none;
  color: white;
  display: flex;
  align-items: center;
  flex-direction: column;
  gap: 10px;
  font-size: 14px;
  white-space: nowrap;
}

.nav svg {
  width: 37px;
  height: 37px;
  stroke: currentColor;
  fill: none;
  stroke-width: 2.4;
  stroke-linecap: round;
  stroke-linejoin: round;
}

/* ID OVERLAY */

.overlay {
  position: absolute;
  inset: 0;
  z-index: 10;
  display: none;
  overflow: hidden;
  overscroll-behavior: none;
  touch-action: none;
  background:
    radial-gradient(ellipse at 12% 66%, #5fbd93 0%, transparent 55%),
    linear-gradient(120deg, #193d4e, #1b4751 60%, #193d4e);
}

.overlay.open {
  display: block;
}

.id-layout {
  width: 100%;
  height: 100%;
  padding: 26px 9px 0;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.identity {
  position: relative;
  width: 100%;
  height: 650px;
  min-height: 650px;
  border-radius: 18px;
  background: white;
  color: var(--ink);
  overflow: hidden;
  isolation: isolate;
}

/* ANIMATED PASTEL LINES */

.lines {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: -1;
  pointer-events: none;
}

@keyframes blyRotate {
  0% {
    transform: rotate(0deg) scale(1);
  }

  50% {
    transform: rotate(180deg) scale(1.035);
  }

  100% {
    transform: rotate(360deg) scale(1);
  }
}

.bly-security-lines {
  animation: blyRotate 38s linear infinite;
  transform-box: view-box;
  transform-origin: 210px 380px;
}

/* HEADER */

.id-top {
  position: relative;
  z-index: 3;
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  padding: 13px 18px;
}

.close, .dots {
  border: 0;
  background: none;
  color: var(--ink);
  font-weight: 300;
  line-height: 1;
}

.close {
  font-size: 44px;
}

.dots {
  font-size: 33px;
}

.demo-logo {
  position: absolute;
  top: 17px;
  left: 50%;
  transform: translateX(-50%);
  width: 100px;
  max-height: 60px;
  object-fit: contain;
  z-index: 4;
}

/* PORTRAIT */

.person {
  position: absolute;
  top: 20%;
  left: 50%;
  transform: translateX(-50%);
  width: 59%;
  max-width: 260px;
}

.portrait {
  display: block;
  width: 100%;
  aspect-ratio: 1 / 1.3;
  object-fit: cover;
  object-position: center;
  background: #e5eeee;
}

.age {
  position: absolute;
  right: -32px;
  bottom: 0;
  padding: 5px 3px 0 13px;
  border-radius: 6px 0 0 0;
  background: white;
  font-size: 58px;
  line-height: 1;
  font-weight: 500;
}

/* DETAILS */

.details {
  position: absolute;
  top: 66%;
  width: 100%;
  text-align: center;
  padding: 0 12px;
}

.person-name {
  font-size: 34px;
  font-weight: 650;
  letter-spacing: -.035em;
  color: var(--ink);
}

.number {
  margin-top: 10px;
  font-size: 22px;
  font-weight: 500;
  letter-spacing: .02em;
  color: #66757b;
}

.demo-warning {
  display: inline-block;
  margin-top: 24px;
  background: #fff0df;
  padding: 10px 14px;
  border-radius: 5px;
  font-size: 12px;
  font-weight: 800;
  letter-spacing: .08em;
}

/* QR PANEL */

.qr-wrap {
  position: relative;
  z-index: 2;
  margin-top: -55px;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.qr-panel {
  width: var(--qr-size);
  height: var(--qr-size);
  padding: 12px;
  background: white;
  box-shadow: 0 8px 10px #0002;
}

.qr-panel svg {
  display: block;
  width: 100%;
  height: 100%;
}

/* YELLOW BOX */

.yellow-box {
  position: absolute;
  top: -48px;
  left: 50%;
  transform: translateX(-50%);
  width: 195px;
  height: 30px;
  background: #ffe68a;
  border-radius: 4px;
  z-index: 3;
}

.yellow-box::after {
  content: "";
  position: absolute;
  bottom: -10px;
  left: 50%;
  transform: translateX(-50%);
  border-left: 11px solid transparent;
  border-right: 11px solid transparent;
  border-top: 11px solid #ffe68a;
}

.caption {
  margin-top: 18px;
  color: white;
  font-size: 15px;
  line-height: 1.35;
  text-align: center;
}

.footnote {
  margin-top: 12px;
  color: #d8e6e8;
  font-size: 12px;
  text-align: center;
}

/* PIXEL MAGNIFIER */

#pixelLens {
  position: absolute;
  left: 0;
  top: 0;
  width: 270px;
  height: 270px;
  border-radius: 50%;
  overflow: hidden;
  pointer-events: none;
  z-index: 9999;
  border: 2px solid rgba(255,255,255,.7);
  box-shadow: 0 8px 30px #0004;
  opacity: 0;
  transform: translate(-50%,-50%) scale(.15);
  transition:
    opacity .22s ease,
    transform .4s cubic-bezier(.2,.8,.2,1);
  background: transparent;
}

#pixelLens.active {
  opacity: 1;
  transform: translate(-50%,-50%) scale(1);
}

#pixelCanvas {
  display: block;
  width: 100%;
  height: 100%;
  image-rendering: pixelated;
}

.toast {
  position: absolute;
  z-index: 20;
  bottom: 22px;
  left: 50%;
  transform: translateX(-50%);
  display: none;
  padding: 12px 18px;
  border-radius: 12px;
  background: white;
  color: var(--ink);
  box-shadow: 0 8px 20px #0003;
  white-space: nowrap;
}

/* REAL MOBILE */

@media (max-width: 600px) {
  body {
    background: var(--bg);
  }

  .preview-stage {
    position: fixed;
    inset: 0;
    display: block;
  }

  .phone {
    position: relative;
    top: auto;
    left: auto;
    width: 100%;
    height: 100svh;
    border: 0;
    border-radius: 0;
    box-shadow: none;
    transform: none;
  }

  .phone-screen {
    border-radius: 0;
  }

  .identity {
    height: clamp(650px,77svh,790px);
  }
}

@media (prefers-reduced-motion: reduce) {
  .bly-security-lines {
    animation: none;
  }

  #pixelLens {
    transition: none;
  }
}
</style>
</head>

<body>

<div class="preview-stage">

    <div class="phone-screen" id="phoneScreen">

      <!-- HOME -->

<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

<script>
/* AUTO-FIT IPHONE PREVIEW */

function fitPhoneToScreen() {
  const phone = document.getElementById('phone');

  if (window.innerWidth <= 600) {
    phone.style.setProperty('--phone-scale', 1);
    return;
  }

  const margin = 50;

  const scale = Math.min(
    (window.innerWidth - margin) / 390,
    (window.innerHeight - margin) / 844,
    1
  );

  phone.style.setProperty('--phone-scale', Math.max(0.1, scale));
}

window.addEventListener('resize', fitPhoneToScreen);
fitPhoneToScreen();

/* NAVIGATION */

const phoneScreen = document.getElementById('phoneScreen');
const overlay = document.getElementById('overlay');
const toast = document.getElementById('toast');

document.getElementById('openId').addEventListener('click', () => {
  overlay.classList.add('open');
});

function closeCard() {
  overlay.classList.remove('open');
  releaseLens();
}

document.getElementById('closeId').addEventListener('click', closeCard);

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeCard();
});

let toastTimer;

function showToast(message) {
  toast.textContent = message;
  toast.style.display = 'block';
  clearTimeout(toastTimer);

  toastTimer = setTimeout(() => {
    toast.style.display = 'none';
  }, 2300);
}

document.getElementById('scan').addEventListener('click', () => {
  showToast('QR-skanning kommer senare');
});

document.getElementById('menu').addEventListener('click', () => {
  showToast('Meny kommer senare');
});

document.getElementById('more').addEventListener('click', () => {
  showToast('BLY Demo');
});

/* PASTEL CIRCLES */

{
  const curveGroup = document.getElementById('curveGroup');
  const colors = ['#e5a4ce','#a4d7e1','#b4b5df','#b6d4d0'];

  for (let i = 0; i < 30; i++) {
    const path = document.createElementNS(
      'http://www.w3.org/2000/svg', 'path'
    );

    const radius =
      115 + Math.floor(i / 5) * 35 + (i % 5) * 2.5;

    const points = [];

    for (let j = 0; j <= 240; j++) {
      const angle = (j / 240) * Math.PI * 2;

      const distortion =
        Math.sin(angle * 3 + i * 0.025) * 11 +
        Math.cos(angle * 5 - i * 0.015) * 6;

      const r = radius + distortion;
      const x = 210 + Math.cos(angle) * r * 1.45;
      const y = 380 + Math.sin(angle) * r * 1.65;

      points.push(
        `${j === 0 ? 'M' : 'L'} ${x.toFixed(2)} ${y.toFixed(2)}`
      );
    }

    path.setAttribute('d', points.join(' ') + ' Z');
    path.setAttribute('fill', 'none');
    path.setAttribute('stroke', colors[i % colors.length]);
    path.setAttribute('stroke-width', '0.9');
    path.setAttribute('opacity', '0.65');

    curveGroup.appendChild(path);
  }
}

/* PIXEL MAGNIFIER */

const lens = document.getElementById('pixelLens');
const pixelCanvas = document.getElementById('pixelCanvas');
const pixelCtx = pixelCanvas.getContext('2d');

const pixelSize = 12;
const zoom = 2.4;

let snapshot = null;
let lensActive = false;
let activePointerId = null;
let pointerX = 0;
let pointerY = 0;
let captureVersion = 0;

function configureLens() {
  const size = lens.offsetWidth || 270;
  const width = Math.round(size / pixelSize);

  if (pixelCanvas.width !== width || pixelCanvas.height !== width) {
    pixelCanvas.width = width;
    pixelCanvas.height = width;
  }

  return size;
}

function updateLens(x, y) {
  const screenRect = phoneScreen.getBoundingClientRect();

  pointerX = x;
  pointerY = y;

  const scale = screenRect.width / phoneScreen.offsetWidth || 1;
  const localX = (x - screenRect.left) / scale;
  const localY = (y - screenRect.top) / scale;

  lens.style.left = localX + 'px';
  lens.style.top = localY + 'px';

  if (!snapshot) return;

  const size = configureLens();
  const sampleSize = size / zoom;

  const scaleX = snapshot.width / overlay.clientWidth;
  const scaleY = snapshot.height / overlay.clientHeight;

  const sx = (localX - sampleSize / 2) * scaleX;
  const sy = (localY - sampleSize / 2) * scaleY;

  pixelCtx.imageSmoothingEnabled = false;
  pixelCtx.clearRect(0, 0, pixelCanvas.width, pixelCanvas.height);

  pixelCtx.drawImage(
    snapshot,
    sx, sy,
    sampleSize * scaleX,
    sampleSize * scaleY,
    0, 0,
    pixelCanvas.width,
    pixelCanvas.height
  );
}

async function captureScreen() {
  if (typeof html2canvas !== 'function') {
    throw new Error('html2canvas is not available');
  }

  return html2canvas(overlay, {
    backgroundColor: null,
    scale: window.devicePixelRatio || 1,
    useCORS: true,
    logging: false,
    width: overlay.clientWidth,
    height: overlay.clientHeight
  });
}

overlay.addEventListener('pointerdown', async e => {
  if (e.target.closest('button')) return;
  if (lensActive) return;

  lensActive = true;
  activePointerId = e.pointerId;
  snapshot = null;

  const version = ++captureVersion;

  try {
    overlay.setPointerCapture(e.pointerId);
  } catch (error) {}

  updateLens(e.clientX, e.clientY);
  lens.classList.add('active');

  try {
    const captured = await captureScreen();

    if (!lensActive || version !== captureVersion) return;

    snapshot = captured;
    updateLens(pointerX, pointerY);
  } catch (error) {
    console.error('Magnifier capture failed:', error);
  }
});

overlay.addEventListener('pointermove', e => {
  if (!lensActive || e.pointerId !== activePointerId) return;
  updateLens(e.clientX, e.clientY);
});

function releaseLens() {
  lensActive = false;
  activePointerId = null;
  captureVersion++;
  lens.classList.remove('active');
}

overlay.addEventListener('pointerup', releaseLens);
overlay.addEventListener('pointercancel', releaseLens);
window.addEventListener('blur', releaseLens);

window.addEventListener('resize', () => {
  if (lensActive) updateLens(pointerX, pointerY);
});

/* DISABLE WHEEL SCROLLING INSIDE PREVIEW */

document.querySelector('.preview-stage').addEventListener(
  'wheel',
  e => e.preventDefault(),
  { passive: false }
);
</script>
