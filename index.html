<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#061f24">
  <title>BLY</title>
  <style>
    :root { color-scheme: dark; --bg:#061f24; --white:#fff; }
    * { box-sizing:border-box; }
    html,body { margin:0; width:100%; min-height:100%; }
    body { background:var(--bg); color:var(--white); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    .app { position:relative; min-height:100vh; min-height:100dvh; display:flex; align-items:center; justify-content:center; padding:env(safe-area-inset-top) 18px calc(115px + env(safe-area-inset-bottom)); }
    .brand { font-size:clamp(86px,24vw,155px); font-weight:850; font-style:italic; letter-spacing:-.095em; line-height:1; transform:translateX(-.045em); user-select:none; }
    .nav { position:absolute; bottom:calc(34px + env(safe-area-inset-bottom)); left:0; width:100%; display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); align-items:end; gap:4px; padding:0 12px; }
    .nav button { appearance:none; border:0; background:transparent; color:white; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; gap:12px; min-height:88px; font:inherit; font-size:clamp(14px,4vw,18px); cursor:pointer; padding:8px 2px; }
    .nav svg { width:38px; height:38px; stroke:currentColor; fill:none; stroke-width:2.6; stroke-linecap:round; stroke-linejoin:round; }
    .nav button:focus-visible { outline:2px solid white; outline-offset:3px; border-radius:8px; }
    .nav button:active { opacity:.65; }
    .notice { position:absolute; left:20px; right:20px; bottom:calc(150px + env(safe-area-inset-bottom)); text-align:center; font-size:14px; opacity:0; pointer-events:none; transition:opacity .2s; }
    .notice.show { opacity:1; }
    @media (max-height:560px) { .brand {font-size:72px;} .nav {bottom:calc(8px + env(safe-area-inset-bottom));} .nav button {min-height:65px;gap:4px;} }
  </style>
</head>
<body>
  <main class="app">
    <div class="brand" aria-label="BLY">BLY</div>
    <p id="notice" class="notice" role="status" aria-live="polite"></p>
    <nav class="nav" aria-label="Huvudmeny">
      <button type="button" data-name="BLY" aria-label="BLY">
        <svg viewBox="0 0 40 40" aria-hidden="true"><rect x="9" y="3" width="22" height="34" rx="2"/><circle cx="20" cy="14" r="4" fill="currentColor" stroke="none"/><path d="M13 24c0-5 14-5 14 0M15 31h10"/></svg>
        <span>BLY</span>
      </button>
      <button type="button" data-name="Skanna QR-kod">
        <svg viewBox="0 0 40 40" aria-hidden="true"><path d="M3 14V3h11M26 3h11v11M37 26v11H26M14 37H3V26"/><rect x="10" y="10" width="7" height="7"/><rect x="23" y="10" width="7" height="7"/><rect x="10" y="23" width="7" height="7"/><path d="M23 23h4v4h-4zM30 23v7h-7"/></svg>
        <span>Skanna QR-kod</span>
      </button>
      <button type="button" data-name="Meny">
        <svg viewBox="0 0 40 40" aria-hidden="true"><path d="M5 10h30M5 20h30M5 30h30" stroke-width="3.5"/></svg>
        <span>Meny</span>
      </button>
    </nav>
  </main>
  <script>
    const notice = document.getElementById('notice');
    document.querySelectorAll('.nav button').forEach(button => {
      button.addEventListener('click', () => {
        notice.textContent = `${button.dataset.name} – kommer snart`;
        notice.classList.add('show');
      });
    });
  </script>
</body>
</html>
