
<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#092127">
<title>BLY – Demo</title>

<style>
:root {
  --bg: #092127;
  --ink: #092127;
  --phone-width: 390px;
  --phone-height: 844px;
  --phone-scale: 1;
  --qr-size: 155px;
  --lens-size: 170px;
}

* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  overscroll-behavior: none;
  font-family: -apple-system, BlinkMacSystemFont,
    "Segoe UI", Arial, sans-serif;
  color: white;
}

button {
  font: inherit;
  cursor: pointer;
}

button:focus-visible {
  outline: 3px solid #56d8d4;
  outline-offset: 4px;
}

body {
  background: #101820;
}

/* IPHONE PREVIEW */

.preview-stage {
  position: fixed;
  inset: 0;
  display: grid;
  place-items: center;
  overflow: hidden;
}

.phone {
  position: absolute;
  width: var(--phone-width);
  height: var(--phone-height);
  left: 50%;
  top: 50%;
  overflow: hidden;
  border-radius: 48px;
  border: 7px solid #05090c;
  background: var(--bg);
  box-shadow:
    0 0 0 2px #56636b,
    0 20px 80px #0009;
  isolation: isolate;
  transform:
    translate(-50%, -50%)
    scale(var(--phone-scale));
  transform-origin: center center;
}

.phone-screen {
  position: relative;
  width: 100%;
  height: 100%;
  overflow: hidden;
  border-radius: 40px;
  background: var(--bg);
}

/* HOME */

.home {
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  position: relative;
  padding: 24px 18px 130px;
}

.home-logo {
  font-size: 130px;
  font-weight: 900;
  font-style: italic;
  letter-spacing: -.13em;
  line-height: .8;
  padding-right: .14em;
}

.home-name {
  font-size: 48px;
  font-weight: 800;
  font-style: italic;
  letter-spacing: -.05em;
  margin-top: 12px;
}

.nav {
  position: absolute;
  bottom: 40px;
  left: 0;
  right: 0;
  display: flex;
  justify-content: space-around;
  align-items: flex-end;
  gap: 8px;
  padding: 0 16px;
}

.nav button {
  width: 33.33%;
  border: 0;
  background: none;
  color: white;
  display: flex;
  align-items: center;
  flex-direction: column;
  gap: 10px;
  font-size: 14px;
  white-space: nowrap;
}

.nav svg {
  width: 37px;
  height: 37px;
  stroke: currentColor;
  fill: none;
  stroke-width: 2.4;
  stroke-linecap: round;
  stroke-linejoin: round;
}

/* ID SCREEN */

.overlay {
  position: absolute;
  inset: 0;
  z-index: 10;
  display: none;
  overflow: hidden;
  overscroll-behavior: none;
  touch-action: none;
  background:
    radial-gradient(
      ellipse at 12% 66%,
      #5fbd93 0%,
      transparent 55%
    ),
    linear-gradient(
      120deg,
      #193d4e,
      #1b4751 60%,
      #193d4e
    );
}

.overlay.open {
  display: block;
}

.id-layout {
  position: relative;
  width: 100%;
  height: 100%;
  padding: 26px 9px 0;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.identity {
  position: relative;
  width: 100%;
  height: 650px;
  flex: none;
  border-radius: 18px;
  background: white;
  color: var(--ink);
  overflow: hidden;
  isolation: isolate;
}

/* SECURITY LINES */

.lines {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: -1;
  pointer-events: none;
}

.bly-lines-clockwise {
  transform-origin: 50% 50%;
  animation: rotateClockwise 38s linear infinite;
}

.bly-lines-counterclockwise {
  transform-origin: 50% 50%;
  animation: rotateCounterclockwise 47s linear infinite;
}

@keyframes rotateClockwise {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

@keyframes rotateCounterclockwise {
  from { transform: rotate(360deg); }
  to { transform: rotate(0deg); }
}

/* HEADER */

.id-top {
  position: relative;
  z-index: 3;
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  padding: 13px 18px;
}

.close,
.dots {
  border: 0;
  background: none;
  color: var(--ink);
  font-weight: 300;
  line-height: 1;
}

.close { font-size: 44px; }
.dots { font-size: 33px; }

.demo-logo {
  position: absolute;
  top: 17px;
  left: 50%;
  transform: translateX(-50%);
  width: 100px;
  max-height: 60px;
  object-fit: contain;
  z-index: 4;
}

/* PORTRAIT */

.person {
  position: absolute;
  top: 20%;
  left: 50%;
  transform: translateX(-50%);
  width: 55%;
  max-width: 245px;
}

.portrait {
  display: block;
  width: 100%;
  aspect-ratio: 1 / 1.3;
  object-fit: cover;
  object-position: center;
  background: #e5eeee;
}

.age {
  position: absolute;
  right: -32px;
  bottom: 0;
  padding: 5px 3px 0 13px;
  border-radius: 6px 0 0 0;
  background: white;
  font-size: 58px;
  line-height: 1;
  font-weight: 500;
}

/* DETAILS */

.details {
  position: absolute;
  top: 61.5%;
  width: 100%;
  text-align: center;
  padding: 0 12px;
}

.person-name {
  font-size: 34px;
  font-weight: 650;
  letter-spacing: -.035em;
  color: var(--ink);
}

.number {
  margin-top: 5px;
  font-size: 19px;
  font-weight: 500;
  letter-spacing: .02em;
  color: #66757b;
}

.demo-warning {
  display: inline-block;
  margin-top: 12px;
  background: #fff0df;
  padding: 7px 10px;
  border-radius: 5px;
  font-size: 11px;
  font-weight: 800;
  letter-spacing: .06em;
}

/* QR PNG — MOVED 10 PX FURTHER UP */

.qr-wrap {
  position: relative;
  z-index: 2;
  margin-top: -75px;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.qr-panel {
  width: var(--qr-size);
  height: var(--qr-size);
  padding: 12px;
  background: white;
  box-shadow: 0 8px 10px #0002;
}

.qr-image {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
}

/* BOX ABOVE QR */

.yellow-box {
  position: absolute;
  top: -38px;
  left: 50%;
  transform: translateX(-50%);
  width: 195px;
  height: 28px;
  background: #fff0df;
  border-radius: 4px;
  z-index: 3;
}

.yellow-box::after {
  content: "";
  position: absolute;
  bottom: -10px;
  left: 50%;
  transform: translateX(-50%);
  border-left: 11px solid transparent;
  border-right: 11px solid transparent;
  border-top: 11px solid #fff0df;
}

.caption {
  margin-top: 18px;
  color: white;
  font-size: 15px;
  line-height: 1.35;
  text-align: center;
}

.footnote {
  margin-top: 12px;
  color: #d8e6e8;
  font-size: 12px;
  text-align: center;
}

/* PIXEL MAGNIFIER */

#pixelLens {
  position: absolute;
  left: 0;
  top: 0;
  width: var(--lens-size);
  height: var(--lens-size);
  border-radius: 50%;
  overflow: hidden;
  pointer-events: none;
  z-index: 9999;
  border: 2px solid rgba(255,255,255,.7);
  box-shadow: 0 8px 30px #0004;
  opacity: 0;
  transform: translate(-50%,-50%) scale(.15);
  transition:
    opacity .22s ease,
    transform .3s cubic-bezier(.2,.8,.2,1);
  background: transparent;
}

#pixelLens.active {
  opacity: 1;
  transform: translate(-50%,-50%) scale(1);
}

#pixelCanvas {
  display: block;
  width: 100%;
  height: 100%;
  image-rendering: pixelated;
}

.toast {
  position: absolute;
  z-index: 20;
  bottom: 22px;
  left: 50%;
  transform: translateX(-50%);
  display: none;
  padding: 12px 18px;
  border-radius: 12px;
  background: white;
  color: var(--ink);
  box-shadow: 0 8px 20px #0003;
  white-space: nowrap;
}

/* MOBILE */

@media (max-width: 600px) {
  body {
    background: var(--bg);
  }

  .preview-stage {
    position: fixed;
    inset: 0;
    display: block;
  }

  .phone {
    position: relative;
    top: auto;
    left: auto;
    width: 100%;
    height: 100svh;
    border: 0;
    border-radius: 0;
    box-shadow: none;
    transform: none;
  }

  .phone-screen {
    border-radius: 0;
  }

  .id-layout {
    padding-top: 12px;
  }

  .identity {
    height: min(650px, 77svh);
  }
}

@media (prefers-reduced-motion: reduce) {
  .bly-lines-clockwise,
  .bly-lines-counterclockwise {
    animation: none;
  }

  #pixelLens {
    transition: none;
  }
}
</style>
</head>

<body>

<div class="preview-stage">
  <div class="phone" id="phone">
    <div class="phone-screen" id="phoneScreen">

      <!-- HOME -->

      <main class="home" id="home">
        <div class="home-logo" aria-hidden="true">B</div>
        <div class="home-name">BLY</div>

        <nav class="nav" aria-label="Huvudmeny">

          <button id="openId" aria-label="Visa BLY">
            <svg viewBox="0 0 32 32">
              <rect x="5" y="2" width="22" height="28" rx="1"/>
              <circle cx="16" cy="11" r="3"
                fill="currentColor" stroke="none"/>
              <path d="M10 20c0-6 12-6 12 0M11 25h10"/>
            </svg>
            <span>BLY</span>
          </button>

          <button id="scan">
            <svg viewBox="0 0 32 32">
              <path d="M3 11V3h8M21 3h8v8M29 21v8h-8M11 29H3v-8"/>
              <path d="M11 11h4v4h-4zM19 11h3v3h-3zM18 19h4v4h-4z"/>
            </svg>
            <span>Skanna QR-kod</span>
          </button>

          <button id="menu">
            <svg viewBox="0 0 32 32">
              <path d="M3 7h26M3 16h26M3 25h26"/>
            </svg>
            <span>Meny</span>
          </button>

        </nav>
      </main>

      <!-- ID CARD -->

      <section class="overlay" id="overlay"
        role="dialog"
        aria-modal="true"
        aria-label="BLY demo">

        <div class="id-layout">

          <article class="identity">

            <svg class="lines"
              viewBox="0 0 420 760"
              preserveAspectRatio="none"
              aria-hidden="true">

              <g id="clockwiseLines"
                class="bly-lines-clockwise"
                fill="none"></g>

              <g id="counterclockwiseLines"
                class="bly-lines-counterclockwise"
                fill="none"></g>

            </svg>

            <header class="id-top">
              <button class="close" id="closeId"
                aria-label="Stäng">×</button>

              <button class="dots" id="more"
                aria-label="Fler alternativ">⋮</button>
            </header>

            <img class="demo-logo"
              src="bly-logo.png"
              alt="BLY Demo">

            <div class="person">
              <img class="portrait"
                src="portrait.png"
                alt="BLY demo portrait">
              <div class="age">16</div>
            </div>

            <div class="details">
              <div class="person-name">
                Johannes Young
              </div>

              <div class="number">
                FAKEFA-FAKE
              </div>

              <div class="demo-warning">
                EJ GILTIG LEGITIMATION
              </div>
            </div>

          </article>

          <!-- QR IMAGE -->

          <div class="qr-wrap">

            <div class="yellow-box"
              aria-hidden="true"></div>

            <div class="qr-panel">
              <img
                class="qr-image"
                src="qr-code.png"
                alt="Dekorativ QR-bild för demo">
            </div>

            <div class="caption">
              Delas via QR-koden:<br>
              Fiktiv demo – inga personuppgifter
            </div>

            <div class="footnote">
              BLY DEMO · Ej giltig som legitimation
            </div>

          </div>
        </div>
      </section>

      <!-- PIXEL MAGNIFIER -->

      <div id="pixelLens" aria-hidden="true">
        <canvas id="pixelCanvas"></canvas>
      </div>

      <div class="toast" id="toast" role="status"></div>

    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

<script>
/* IPHONE AUTO FIT */

function fitPhoneToScreen() {
  const phone = document.getElementById('phone');

  if (window.innerWidth <= 600) {
    phone.style.setProperty('--phone-scale', 1);
    return;
  }

  const margin = 50;

  const scale = Math.min(
    (window.innerWidth - margin) / 390,
    (window.innerHeight - margin) / 844,
    1
  );

  phone.style.setProperty(
    '--phone-scale',
    Math.max(0.1, scale)
  );
}

window.addEventListener('resize', fitPhoneToScreen);
fitPhoneToScreen();

/* NAVIGATION */

const phoneScreen = document.getElementById('phoneScreen');
const overlay = document.getElementById('overlay');
const toast = document.getElementById('toast');

document.getElementById('openId').addEventListener('click', () => {
  overlay.classList.add('open');
});

function closeCard() {
  overlay.classList.remove('open');
  releaseLens();
}

document.getElementById('closeId').addEventListener('click', closeCard);

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeCard();
});

let toastTimer;

function showToast(message) {
  toast.textContent = message;
  toast.style.display = 'block';
  clearTimeout(toastTimer);

  toastTimer = setTimeout(() => {
    toast.style.display = 'none';
  }, 2300);
}

document.getElementById('scan').addEventListener('click', () => {
  showToast('QR-skanning kommer senare');
});

document.getElementById('menu').addEventListener('click', () => {
  showToast('Meny kommer senare');
});

document.getElementById('more').addEventListener('click', () => {
  showToast('BLY Demo');
});

/* DYNAMIC WAVY AND STRAIGHT SECURITY LINES */

{
  const clockwise = document.getElementById('clockwiseLines');
  const counterclockwise = document.getElementById('counterclockwiseLines');

  const colors = [
    '#e5a4ce',
    '#a4d7e1',
    '#b4b5df',
    '#b6d4d0'
  ];

  const lineGroups = [];

  function createSecurityLine(group, index, reverse) {
    const path = document.createElementNS(
      'http://www.w3.org/2000/svg',
      'path'
    );

    path.setAttribute('fill', 'none');
    path.setAttribute(
      'stroke',
      colors[(index + (reverse ? 2 : 0)) % colors.length]
    );
    path.setAttribute('stroke-width', '0.85');
    path.setAttribute('opacity', reverse ? '0.5' : '0.65');

    group.appendChild(path);

    return {
      path,
      index,
      reverse,
      phase: reverse ? 1.8 : 0.3,
      straightness: index % 4 === 0 ? 0.65 : 0
    };
  }

  for (let i = 0; i < 26; i++) {
    lineGroups.push(createSecurityLine(clockwise, i, false));
    lineGroups.push(createSecurityLine(counterclockwise, i, true));
  }

  function updateSecurityLines(time) {
    const t = time * 0.001;

    for (const line of lineGroups) {
      const { index, phase, straightness, path } = line;

      const points = [];
      const steps = 360;
      const baseRadius = 100 + index * 8;

      const spacingMovement =
        Math.sin(t * 0.55 + index * 0.42 + phase) * 9 +
        Math.sin(t * 0.27 - index * 0.21) * 5;

      for (let j = 0; j <= steps; j++) {
        const angle = (j / steps) * Math.PI * 2;

        const distortion =
          Math.sin(angle * 3 + phase + index * 0.025) * 15 +
          Math.cos(angle * 5 - phase - index * 0.015) * 9 +
          Math.sin(angle * 7 + index * 0.03) * 4;

        const straightWave =
          Math.sin(angle * 4 + phase);

        const straightFactor =
          straightness *
          Math.pow(Math.abs(straightWave), 6);

        const finalDistortion =
          distortion * (1 - straightFactor);

        const r =
          baseRadius +
          spacingMovement +
          finalDistortion;

        const x = 210 + Math.cos(angle) * r * 1.25;
        const y = 380 + Math.sin(angle) * r * 1.55;

        points.push(
          `${j === 0 ? 'M' : 'L'} ${x.toFixed(2)} ${y.toFixed(2)}`
        );
      }

      path.setAttribute('d', points.join(' ') + ' Z');
    }

    requestAnimationFrame(updateSecurityLines);
  }

  requestAnimationFrame(updateSecurityLines);
}

/* LIVE PIXEL MAGNIFIER */

const lens = document.getElementById('pixelLens');
const pixelCanvas = document.getElementById('pixelCanvas');
const pixelCtx = pixelCanvas.getContext('2d');

const pixelSize = 28;
const zoom = 2.4;

let lensActive = false;
let activePointerId = null;
let pointerX = 0;
let pointerY = 0;
let snapshot = null;
let captureInProgress = false;
let captureTimer = null;
let captureVersion = 0;

function configureLens() {
  const size = lens.offsetWidth || 170;

  const resolution = Math.max(
    1,
    Math.round(size / pixelSize)
  );

  if (
    pixelCanvas.width !== resolution ||
    pixelCanvas.height !== resolution
  ) {
    pixelCanvas.width = resolution;
    pixelCanvas.height = resolution;
  }

  return size;
}

/* CORRECT POSITION INSIDE SCALED IPHONE */

function getLocalPosition(clientX, clientY) {
  const rect = phoneScreen.getBoundingClientRect();

  return {
    x: (clientX - rect.left) *
      (phoneScreen.offsetWidth / rect.width),
    y: (clientY - rect.top) *
      (phoneScreen.offsetHeight / rect.height)
  };
}

/* DRAW MAGNIFIER */

function updateLens(clientX, clientY) {
  pointerX = clientX;
  pointerY = clientY;

  const pos = getLocalPosition(clientX, clientY);

  lens.style.left = pos.x + 'px';
  lens.style.top = pos.y + 'px';

  if (!snapshot) return;

  const size = configureLens();
  const sampleSize = size / zoom;

  const overlayRect = overlay.getBoundingClientRect();

  const overlayX =
    (clientX - overlayRect.left) *
    (overlay.clientWidth / overlayRect.width);

  const overlayY =
    (clientY - overlayRect.top) *
    (overlay.clientHeight / overlayRect.height);

  const screenshotScaleX =
    snapshot.width / overlay.clientWidth;

  const screenshotScaleY =
    snapshot.height / overlay.clientHeight;

  const sourceX =
    (overlayX - sampleSize / 2) * screenshotScaleX;

  const sourceY =
    (overlayY - sampleSize / 2) * screenshotScaleY;

  pixelCtx.imageSmoothingEnabled = false;

  pixelCtx.clearRect(
    0, 0,
    pixelCanvas.width,
    pixelCanvas.height
  );

  pixelCtx.drawImage(
    snapshot,
    sourceX,
    sourceY,
    sampleSize * screenshotScaleX,
    sampleSize * screenshotScaleY,
    0,
    0,
    pixelCanvas.width,
    pixelCanvas.height
  );
}

/* CAPTURE EVERYTHING INCLUDING PNG IMAGES */

async function captureScreen(version) {
  if (!lensActive || captureInProgress) return;

  if (typeof html2canvas !== 'function') {
    console.error('html2canvas is unavailable');
    return;
  }

  captureInProgress = true;

  try {
    const canvas = await html2canvas(overlay, {
      backgroundColor: null,
      scale: Math.min(window.devicePixelRatio || 1, 2),
      useCORS: true,
      allowTaint: false,
      logging: false,
      width: overlay.clientWidth,
      height: overlay.clientHeight,
      scrollX: 0,
      scrollY: 0
    });

    if (lensActive && version === captureVersion) {
      snapshot = canvas;
      updateLens(pointerX, pointerY);
    }

  } catch (error) {
    console.error('Magnifier capture failed:', error);
  } finally {
    captureInProgress = false;
  }
}

/* START MAGNIFIER */

overlay.addEventListener('pointerdown', async e => {
  if (e.target.closest('button')) return;
  if (lensActive) return;

  lensActive = true;
  activePointerId = e.pointerId;

  pointerX = e.clientX;
  pointerY = e.clientY;

  snapshot = null;

  const version = ++captureVersion;

  try {
    overlay.setPointerCapture(e.pointerId);
  } catch (error) {}

  configureLens();
  updateLens(e.clientX, e.clientY);

  lens.classList.add('active');

  await captureScreen(version);

  if (!lensActive || version !== captureVersion) return;

  captureTimer = setInterval(() => {
    captureScreen(version);
  }, 180);
});

/* MOVE MAGNIFIER */

overlay.addEventListener('pointermove', e => {
  if (!lensActive) return;
  if (e.pointerId !== activePointerId) return;

  updateLens(e.clientX, e.clientY);
});

/* STOP MAGNIFIER */

function releaseLens() {
  lensActive = false;
  activePointerId = null;
  captureVersion++;

  clearInterval(captureTimer);
  captureTimer = null;

  lens.classList.remove('active');
  snapshot = null;
}

overlay.addEventListener('pointerup', releaseLens);
overlay.addEventListener('pointercancel', releaseLens);
window.addEventListener('blur', releaseLens);

window.addEventListener('resize', () => {
  if (lensActive) {
    updateLens(pointerX, pointerY);
  }
});

/* DISABLE SCROLLING */

document.querySelector('.preview-stage').addEventListener(
  'wheel',
  e => e.preventDefault(),
  { passive: false }
);
</script>

</body>
</html>
